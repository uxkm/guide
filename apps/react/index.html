<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="UXKM">
    <meta name="description" content="프레임워크별 UI 컴포넌트와 디자인 시스템 가이드">
    <meta name="theme-color" content="#f4f6f9">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('uxkm-demo-theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'dark' ? '#0f1419' : '#f4f6f9'
          );
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" href="/images/meta/favicon/favicon.ico" sizes="16x16 32x32">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/meta/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/meta/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/meta/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/images/meta/favicon/site.webmanifest">
    <link rel="stylesheet" href="/styles/uxkm.css">
    <link rel="stylesheet" href="/styles/demo.css">
    <title>UXKM React</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
