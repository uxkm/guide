<!-- Snackbar 원본 구현: 피드백 상태와 노출 동작을 관리하고 필요한 접근성 역할과 사용자 이벤트를 연결합니다. -->
<!-- snackbar 루트에 색상·모션·배치 클래스를 함께 적용합니다. -->
<div
  class="snackbar color_info snackbar_motion-fade snackbar_placement-bottom-center"
  data-component="Snackbar"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  aria-relevant="additions text"
>
  <!-- 상태 아이콘 영역입니다. -->
  <svg
    class="snackbar_icon"
    aria-hidden="true"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  >
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M12 16v-4M12 8h.01"></path>
  </svg>
  <!-- 메시지 텍스트 영역입니다. -->
  <span class="snackbar_message">새로운 업데이트가 있습니다.</span>
  <!-- data-snackbar-close로 닫기 동작을 연결합니다. -->
  <button
    type="button"
    class="btn btn_ghost btn_icon-only snackbar_close"
    data-snackbar-close
    aria-label="알림 닫기"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 6L6 18M6 6l12 12"></path>
    </svg>
  </button>
</div>
