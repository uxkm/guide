<form class="form form_vertical form_fit" data-component="FormLayout">
  <div class="form_field">
    <label class="form_field-label" for="form-layout-name">이름<span class="form_field-required"><span aria-hidden="true">*</span><span class="form_field-required-text">필수 항목</span></span></label>
    <div class="form_field-control"><input id="form-layout-name" class="input" type="text" required></div>
    <p class="form_field-hint">실명을 입력해 주세요.</p>
  </div>
  <div class="form_field">
    <label class="form_field-label" for="form-layout-email">이메일</label>
    <div class="form_field-control"><input id="form-layout-email" class="input" type="email"></div>
  </div>
  <div class="form_actions">
    <button class="btn btn_filled color_primary" type="submit">저장</button>
    <button class="btn btn_ghost" type="button">취소</button>
  </div>
</form>
