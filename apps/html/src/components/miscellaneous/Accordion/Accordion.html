<div class="accordion accordion_card" data-component="Accordion" data-accordion>
  <div class="accordion_item">
    <div class="accordion_heading" role="heading" aria-level="3">
      <button type="button" class="btn btn_text accordion_trigger" id="accordion-basic-1" aria-expanded="false" aria-controls="accordion-basic-panel-1">
        <span class="accordion_label">배송은 얼마나 걸리나요?</span>
        <svg class="accordion_icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>
    <div class="accordion_panel" id="accordion-basic-panel-1" role="region" aria-labelledby="accordion-basic-1" hidden>
      <div class="accordion_content"><p>평일 기준 2~3일 이내 출고되며, 도서·산간 지역은 1~2일 추가 소요될 수 있습니다.</p></div>
    </div>
  </div>
  <div class="accordion_item is-open">
    <div class="accordion_heading" role="heading" aria-level="3">
      <button type="button" class="btn btn_text accordion_trigger" id="accordion-basic-2" aria-expanded="true" aria-controls="accordion-basic-panel-2">
        <span class="accordion_label">교환·반품은 어떻게 하나요?</span>
        <svg class="accordion_icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>
    <div class="accordion_panel" id="accordion-basic-panel-2" role="region" aria-labelledby="accordion-basic-2">
      <div class="accordion_content"><p>수령 후 7일 이내 마이페이지에서 신청할 수 있습니다. 단순 변심 반품 시 왕복 배송비가 부과됩니다.</p></div>
    </div>
  </div>
  <div class="accordion_item">
    <div class="accordion_heading" role="heading" aria-level="3">
      <button type="button" class="btn btn_text accordion_trigger" id="accordion-basic-3" aria-expanded="false" aria-controls="accordion-basic-panel-3">
        <span class="accordion_label">해외 배송이 가능한가요?</span>
        <svg class="accordion_icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>
    <div class="accordion_panel" id="accordion-basic-panel-3" role="region" aria-labelledby="accordion-basic-3" hidden>
      <div class="accordion_content"><p>현재 국내 배송만 지원합니다. 해외 배송은 준비 중이며 오픈 시 공지사항으로 안내드립니다.</p></div>
    </div>
  </div>
</div>
