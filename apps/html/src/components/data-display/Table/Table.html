<!-- Table 원본 구현: 데이터 표시 구조와 시각 상태를 공통 CSS 클래스 및 접근성 속성으로 표현합니다. -->
<!-- Table 루트에 공통 클래스를 적용합니다. -->
<div class="table_wrap" data-component="Table">
  <!-- 내부에 데이터 표시 콘텐츠를 배치합니다. -->
  <table class="table table_bordered table_hover">
    <thead>
      <tr>
        <th scope="col">이름</th>
        <th scope="col">직군</th>
        <th scope="col">상태</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>홍길동</td>
        <td>Frontend</td>
        <td><span class="badge color_success">활성</span></td>
      </tr>
      <tr>
        <td>김철수</td>
        <td>Backend</td>
        <td><span class="badge color_success">활성</span></td>
      </tr>
      <tr>
        <td>이영희</td>
        <td>Design</td>
        <td><span class="badge color_warning">휴가</span></td>
      </tr>
    </tbody>
  </table>
</div>
