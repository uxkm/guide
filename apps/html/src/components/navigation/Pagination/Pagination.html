<!-- Pagination 원본 구현: 현재 항목과 열림 상태를 관리하고 키보드 탐색, 링크, 접근성 속성을 연결합니다. -->
<!-- pagination 클래스에 data-current·data-total·data-page-size로 페이지 상태를 둡니다. -->
<nav
  class="pagination"
  aria-label="페이지 이동"
  data-component="Pagination"
  data-pagination
  data-current="1"
  data-total="50"
  data-page-size="10"
>
  <!-- 스크립트가 번호 링크를 채우고 이전·다음 버튼으로 페이지를 이동합니다. -->
  <ul class="pagination_list" data-pagination-list>
    <li class="pagination_item">
      <button
        type="button"
        class="btn btn_ghost color_default btn_sm btn_icon-only pagination_btn pagination_prev"
        data-pagination-prev
        aria-label="이전 페이지"
        disabled
      >
        <svg
          class="icon icon_sm pagination_icon"
          data-component="Icon"
          data-icon="chevron-left"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m15 6-6 6 6 6"></path>
        </svg>
      </button>
    </li>
    <li class="pagination_item" data-pagination-next-item>
      <button
        type="button"
        class="btn btn_ghost color_default btn_sm btn_icon-only pagination_btn pagination_next"
        data-pagination-next
        aria-label="다음 페이지"
      >
        <svg
          class="icon icon_sm pagination_icon"
          data-component="Icon"
          data-icon="chevron-right"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m9 6 6 6-6 6"></path>
        </svg>
      </button>
    </li>
  </ul>
</nav>
